<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskesy Temp Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-3 pointer-events-none w-full max-w-sm px-4 text-center"></div>

    <!-- Header -->
    <header class="pt-8 pb-4">
        <div class="container mx-auto px-4 text-center">
            <div class="inline-flex items-center justify-center p-3 bg-white rounded-2xl shadow-sm mb-3">
                <i class="fas fa-bolt text-2xl text-indigo-600"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-purple-600 mb-2">Taskesy Mail</h1>
            <p class="text-slate-500 font-medium text-sm md:text-base">আধুনিক, সুরক্ষিত এবং অস্থায়ী ইনবক্স</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-4 flex-grow max-w-4xl">
        
        <!-- Email Generation Box -->
        <div class="glass-card rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 mb-8 text-center relative overflow-hidden">
            <!-- Loading Overlay -->
            <div id="loadingEmail" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-10 hidden transition-opacity duration-300">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 border-4 border-indigo-100 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <p class="text-slate-600 font-semibold mt-4">অপেক্ষা করুন...</p>
            </div>

            <p class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">আপনার অস্থায়ী ঠিকানা</p>
            
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 bg-white/50 p-3 pl-6 rounded-full border border-white shadow-sm mb-6 max-w-2xl mx-auto">
                <span id="emailAddress" class="text-lg md:text-2xl font-bold text-slate-800 truncate w-full md:w-auto flex-1">---</span>
                <button onclick="copyEmail()" class="w-full md:w-auto bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-8 py-3 rounded-full transition-all shadow-md hover:shadow-lg font-semibold text-sm flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-copy mr-2"></i> কপি
                </button>
            </div>
            
            <div class="flex flex-col md:flex-row items-center justify-center gap-6 text-sm">
                <div class="flex items-center text-indigo-700 font-semibold bg-indigo-50/80 px-5 py-2 rounded-full border border-indigo-100">
                    <i class="fas fa-stopwatch mr-2 text-indigo-500"></i> মেয়াদ: <span id="countdown" class="ml-1 tracking-wider">00:00:00</span>
                </div>
                <button onclick="deleteMailbox()" class="text-slate-500 hover:text-red-500 font-semibold flex items-center transition-colors px-4 py-2 rounded-full hover:bg-red-50">
                    <i class="fas fa-trash-alt mr-2"></i> মেইলবক্স মুছুন
                </button>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="glass-card rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex flex-col h-[500px]">
            <div class="bg-white/50 border-b border-white/60 p-5 flex justify-between items-center backdrop-blur-md sticky top-0 z-10">
                <h2 class="text-lg font-extrabold text-slate-800 flex items-center">
                    <span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mr-3 text-sm">
                        <i class="fas fa-inbox"></i>
                    </span>
                    ইনবক্স
                </h2>
                <div id="pollingIndicator" class="text-xs font-semibold text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-full flex items-center">
                    <i class="fas fa-circle-notch fa-spin mr-1.5"></i> সিঙ্ক হচ্ছে
                </div>
            </div>

            <div class="relative flex-grow overflow-hidden">
                <!-- Email Detail View -->
                <div id="emailDetailView" class="hidden absolute inset-0 bg-white/90 backdrop-blur-md z-20 flex flex-col">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white sticky top-0">
                        <button onclick="closeEmailDetail()" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition-colors">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">মেইল ভিউ</span>
                        <div class="w-10"></div>
                    </div>
                    
                    <div class="p-6 overflow-y-auto hide-scroll flex-grow">
                        <!-- OTP Bubble -->
                        <div id="otpContainer" class="hidden mb-8 flex justify-center">
                            <button onclick="copyOTP()" class="group relative bg-gradient-to-r from-amber-400 to-orange-500 p-[2px] rounded-full shadow-lg hover:shadow-xl transition-all hover:-translate-y-1">
                                <div class="bg-white rounded-full px-8 py-3 flex items-center gap-3">
                                    <i class="fas fa-key text-orange-500"></i>
                                    <span class="text-xs font-bold text-slate-500 uppercase">OTP Code</span>
                                    <span id="otpValue" class="text-2xl font-extrabold text-slate-800 tracking-widest ml-2"></span>
                                    <i class="fas fa-copy text-slate-300 group-hover:text-orange-500 ml-2 transition-colors"></i>
                                </div>
                            </button>
                        </div>

                        <h3 id="detailSubject" class="text-2xl font-extrabold mb-6 text-slate-800 leading-tight"></h3>
                        
                        <div class="flex items-center gap-4 mb-8 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold text-lg shadow-sm" id="avatarInitial">
                                S
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-slate-800 truncate text-sm" id="detailSender"></div>
                                <div class="text-xs text-slate-500 truncate mt-0.5">To: <span id="detailRecipient"></span></div>
                            </div>
                            <div class="text-xs font-semibold text-slate-400 bg-white px-3 py-1.5 rounded-full border border-slate-100" id="detailTime"></div>
                        </div>

                        <div id="detailBody" class="text-slate-700 whitespace-pre-line text-base leading-relaxed p-2"></div>
                    </div>
                </div>

                <!-- Email List -->
                <div id="inboxList" class="absolute inset-0 overflow-y-auto hide-scroll">
                    <!-- Empty State -->
                    <div id="emptyState" class="flex flex-col items-center justify-center h-full text-slate-400 px-6 text-center">
                        <div class="w-24 h-24 bg-white rounded-full shadow-sm flex items-center justify-center mb-6">
                            <i class="fas fa-envelope-open-text text-4xl text-indigo-200"></i>
                        </div>
                        <p class="font-bold text-xl text-slate-700 mb-2">ইনবক্স খালি</p>
                        <p class="text-sm">এখানে আপনার নতুন ইমেইলগুলো দেখা যাবে। আমরা স্বয়ংক্রিয়ভাবে ইনবক্স সিঙ্ক করছি।</p>
                    </div>
                    <!-- List container -->
                    <ul id="emailItems" class="divide-y divide-slate-100/50 hidden"></ul>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        const API = {
            baseUrl: "https://taskesy-temp-mail.mdwldhsn336.workers.dev",
            
            async create() {
                try {
                    const res = await fetch(`${this.baseUrl}/api/create`, { method: "POST", headers: { "Accept": "application/json" } });
                    return await res.json();
                } catch (err) { return { success: false, error: err.message }; }
            },
            
            async getInbox(address) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/inbox?address=${encodeURIComponent(address)}`);
                    return await res.json();
                } catch (err) { return { success: false, error: err.message }; }
            },
            
            async deleteMailbox(address) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/delete?address=${encodeURIComponent(address)}`, { method: "DELETE", headers: { "Accept": "application/json" } });
                    return await res.json();
                } catch (err) { return { success: false, error: err.message }; }
            }
        };

        let currentEmail = "";
        let expiresAt = null;
        let countdownInterval = null;
        let pollingInterval = null;
        let seenEmailIds = new Set();
        let loadedEmails = []; 
        let currentOTP = "";

        document.addEventListener("DOMContentLoaded", initApp);

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const colors = type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            toast.className = `transform transition-all duration-300 translate-y-[-100%] opacity-0 ${colors} text-white px-5 py-3 rounded-2xl shadow-xl pointer-events-auto flex items-center justify-center gap-3 text-sm font-semibold max-w-max mx-auto`;
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-[-100%]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100%]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function initApp() {
            showLoading(true);
            const response = await API.create();
            
            if (response.success) {
                currentEmail = response.address;
                expiresAt = new Date(response.expires_at).getTime();
                document.getElementById('emailAddress').innerText = currentEmail;
                startCountdown();
                startPolling();
                showLoading(false);
            } else {
                showToast("ইমেইল তৈরি করতে সমস্যা হয়েছে: " + (response.error || "Unknown Error"), 'error');
                showLoading(false);
            }
        }

        function showLoading(isLoading) {
            const loader = document.getElementById('loadingEmail');
            if(isLoading) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        async function copyEmail() {
            if (!currentEmail) return;
            try {
                await navigator.clipboard.writeText(currentEmail);
                showToast("ইমেইল ঠিকানা কপি করা হয়েছে!");
            } catch (err) {
                showToast("কপি করতে সমস্যা হয়েছে", 'error');
            }
        }

        async function copyOTP() {
            if (!currentOTP) return;
            try {
                await navigator.clipboard.writeText(currentOTP);
                showToast("OTP কোড কপি করা হয়েছে!");
            } catch (err) {
                showToast("কপি করতে সমস্যা হয়েছে", 'error');
            }
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            const countdownEl = document.getElementById('countdown');
            countdownEl.parentElement.classList.remove('text-red-500', 'bg-red-50', 'border-red-100');
            countdownEl.parentElement.classList.add('text-indigo-700', 'bg-indigo-50/80', 'border-indigo-100');
            
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = expiresAt - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    countdownEl.innerText = "মেয়াদ শেষ";
                    countdownEl.parentElement.classList.remove('text-indigo-700', 'bg-indigo-50/80', 'border-indigo-100');
                    countdownEl.parentElement.classList.add('text-red-600', 'bg-red-50', 'border-red-100');
                    stopPolling();
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownEl.innerText = 
                    String(hours).padStart(2, '0') + ":" + 
                    String(minutes).padStart(2, '0') + ":" + 
                    String(seconds).padStart(2, '0');
            }, 1000);
        }

        function startPolling() {
            fetchInbox();
            pollingInterval = setInterval(fetchInbox, 8000);
        }

        function stopPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('pollingIndicator').classList.add('hidden');
        }

        async function fetchInbox() {
            if (!currentEmail) return;
            const response = await API.getInbox(currentEmail);
            
            if (response.success && response.emails) {
                loadedEmails = response.emails; 
                renderInbox(loadedEmails);
            }
        }

        function renderInbox(emails) {
            const emptyState = document.getElementById('emptyState');
            const emailItems = document.getElementById('emailItems');
            
            if (!emails || emails.length === 0) {
                emptyState.classList.remove('hidden');
                emailItems.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            if(document.getElementById('emailDetailView').classList.contains('hidden')) {
                emailItems.classList.remove('hidden');
            }
            
            let listHTML = '';
            emails.forEach(email => {
                const isNew = !seenEmailIds.has(email.id);
                if(isNew && document.getElementById('emailItems').innerHTML !== '') {
                    showToast("নতুন ইমেইল এসেছে!");
                }
                seenEmailIds.add(email.id);

                const dateStr = email.received_at || email['received at'];
                const subject = email.subject || '(No Subject)';
                const sender = email.sender || 'Unknown Sender';
                const initial = sender.charAt(0).toUpperCase();
                
                listHTML += `
                    <li class="p-4 hover:bg-white/80 cursor-pointer transition-all flex items-center gap-4 ${isNew ? 'bg-indigo-50/50 border-l-4 border-indigo-500' : 'bg-transparent'}" onclick="viewEmail('${email.id}')">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold flex-shrink-0">
                            ${initial}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm font-extrabold text-slate-800 truncate">${escapeHTML(sender)}</span>
                                <span class="text-xs font-semibold text-slate-400 whitespace-nowrap ml-3">${formatDate(dateStr)}</span>
                            </div>
                            <p class="text-sm text-slate-600 truncate">${escapeHTML(subject)}</p>
                        </div>
                    </li>
                `;
            });
            emailItems.innerHTML = listHTML;
        }

        function viewEmail(id) {
            const em = loadedEmails.find(e => String(e.id) === String(id));
            
            if (em) {
                const dateStr = em.received_at || em['received at'];
                const sender = em.sender || 'Unknown';
                
                document.getElementById('detailSubject').innerText = em.subject || '(No Subject)';
                document.getElementById('detailSender').innerText = sender;
                document.getElementById('avatarInitial').innerText = sender.charAt(0).toUpperCase();
                document.getElementById('detailRecipient').innerText = em.recipient || currentEmail;
                document.getElementById('detailTime').innerText = formatDate(dateStr);
                
                const bodyText = em.body || '';
                document.getElementById('detailBody').innerHTML = bodyText ? escapeHTML(bodyText) : '<i>(Empty Message)</i>';
                
                const otpMatch = bodyText.match(/\b\d{6}\b|\b\d{8}\b/);
                const otpContainer = document.getElementById('otpContainer');
                
                if(otpMatch) {
                    currentOTP = otpMatch[0];
                    document.getElementById('otpValue').innerText = currentOTP;
                    otpContainer.classList.remove('hidden');
                } else {
                    currentOTP = "";
                    otpContainer.classList.add('hidden');
                }
                
                document.getElementById('inboxList').classList.add('hidden');
                document.getElementById('emailDetailView').classList.remove('hidden');
            } else {
                showToast("ইমেইলটি খুঁজে পাওয়া যায়নি!", 'error');
            }
        }

        function closeEmailDetail() {
            document.getElementById('emailDetailView').classList.add('hidden');
            document.getElementById('inboxList').classList.remove('hidden');
        }

        async function deleteMailbox() {
            showLoading(true);
            stopPolling();
            if (countdownInterval) clearInterval(countdownInterval);
            
            try {
                const response = await API.deleteMailbox(currentEmail);
                if (response.success) {
                    currentEmail = "";
                    loadedEmails = [];
                    currentOTP = "";
                    document.getElementById('emailAddress').innerText = "---";
                    document.getElementById('countdown').innerText = "00:00:00";
                    document.getElementById('emailItems').innerHTML = '';
                    document.getElementById('emptyState').classList.remove('hidden');
                    document.getElementById('emailItems').classList.add('hidden');
                    closeEmailDetail();
                    
                    showToast("মেইলবক্স ডিলিট করা হয়েছে");
                    initApp();
                } else {
                    showToast("ডিলিট করতে সমস্যা হয়েছে", 'error');
                    startPolling();
                    showLoading(false);
                }
            } catch (err) {
                showToast("নেটওয়ার্ক সমস্যা", 'error');
                startPolling();
                showLoading(false);
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const d = new Date(dateString.replace(' ', 'T'));
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch(e) {
                return dateString;
            }
        }
    </script>
    
    <!-- Monetag Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('Monetag Service Worker Registered!');
                    })
                    .catch(function(err) {
                        console.log('Service Worker Registration Failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
