<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toxic Mail</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: background 0.8s ease-in-out;
        }
        /* Premium Glassmorphism */
        .glass-card { 
            background: rgba(255, 255, 255, 0.55); 
            backdrop-filter: blur(24px) saturate(180%); 
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7); 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth List Animations */
        .animate-mail-in {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .theme-btn { transition: transform 0.2s; }
        .theme-btn:hover { transform: scale(1.15); }
    </style>
</head>
<body id="appBody" class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden transition-colors duration-700">

    <!-- Custom Colorful Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm transition-opacity opacity-0" id="confirmOverlay" onclick="closeConfirmModal()"></div>
        <div class="relative bg-white/80 backdrop-blur-xl border border-white shadow-2xl rounded-[2rem] p-8 w-11/12 max-w-sm transform scale-95 opacity-0 transition-all duration-300 ease-out" id="confirmContent">
            <div class="text-center">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-rose-100 to-red-50 text-rose-500 flex items-center justify-center mx-auto mb-5 shadow-inner border border-white">
                    <i class="fas fa-trash-alt text-3xl drop-shadow-sm"></i>
                </div>
                <h3 class="text-2xl font-extrabold text-slate-800 mb-2">মেইলবক্স ডিলিট?</h3>
                <p class="text-sm text-slate-500 mb-8 px-2 leading-relaxed">আপনি কি নিশ্চিত যে এই মেইলবক্সটি ডিলিট করতে চান? ডিলিট করলে এটি আর ফেরত পাওয়া যাবে না।</p>
                <div class="flex gap-4">
                    <button onclick="closeConfirmModal()" class="flex-1 glass-btn hover:bg-white text-slate-600 font-bold py-3.5 rounded-2xl transition-all shadow-sm">বাতিল</button>
                    <button onclick="confirmDeleteAction()" class="flex-1 bg-gradient-to-r from-rose-500 to-red-500 hover:from-rose-600 hover:to-red-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-200 transition-all transform hover:-translate-y-0.5">ডিলিট করুন</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[90] flex flex-col gap-3 pointer-events-none w-full max-w-sm px-4 text-center"></div>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Sidebar (Saved Emails) -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-72 bg-white/90 backdrop-blur-2xl shadow-2xl border-l border-white/50 z-50 transform translate-x-full transition-transform duration-400 ease-out flex flex-col">
        <div class="p-6 border-b border-slate-100/50 flex justify-between items-center">
            <h2 class="font-extrabold text-slate-800 text-lg"><i class="fas fa-layer-group mr-2 text-indigo-500"></i> হিস্ট্রি</h2>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-rose-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-rose-50">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="flex-grow overflow-y-auto hide-scroll p-4">
            <ul id="savedEmailsList" class="space-y-3">
                <!-- Saved emails will be injected here -->
            </ul>
        </div>
    </div>

    <!-- Header & Theme Switcher -->
    <header class="pt-6 pb-2 relative z-10">
        <div class="container mx-auto px-4 flex flex-col items-center justify-center relative">
            <!-- Glass Theme Pickers -->
            <div class="flex gap-3 mb-4 glass-card px-4 py-2 rounded-full">
                <button onclick="setTheme('default')" class="theme-btn w-6 h-6 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 shadow-md border-2 border-white"></button>
                <button onclick="setTheme('ocean')" class="theme-btn w-6 h-6 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 shadow-md border-2 border-white"></button>
                <button onclick="setTheme('forest')" class="theme-btn w-6 h-6 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 shadow-md border-2 border-white"></button>
                <button onclick="setTheme('sunset')" class="theme-btn w-6 h-6 rounded-full bg-gradient-to-br from-orange-400 to-rose-500 shadow-md border-2 border-white"></button>
            </div>
            
            <div class="flex items-center justify-between w-full">
                <div class="w-12 h-12"></div>
                <div class="text-center flex-1">
                    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm">Toxic Mail</h1>
                </div>
                <button onclick="toggleSidebar()" class="w-12 h-12 glass-btn rounded-2xl shadow-sm text-slate-700 hover:text-indigo-600 transition-colors flex items-center justify-center text-xl relative z-30">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-4 flex-grow max-w-4xl relative z-10">
        
        <!-- Email Generation Box -->
        <div id="mainCard" class="glass-card rounded-[2rem] p-8 mb-8 text-center relative overflow-hidden transition-all duration-500">
            <div id="loadingEmail" class="absolute inset-0 bg-white/80 backdrop-blur-md flex flex-col items-center justify-center z-10 hidden transition-opacity duration-300">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-indigo-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <p class="text-slate-600 font-bold mt-4 tracking-wide">অপেক্ষা করুন...</p>
            </div>

            <p class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-widest">আপনার বর্তমান ঠিকানা</p>
            
            <div class="flex flex-col md:flex-row items-center justify-center gap-3 glass-btn p-3 pl-6 rounded-full shadow-sm mb-6 max-w-2xl mx-auto">
                <span id="emailAddress" class="text-lg md:text-xl font-bold text-slate-800 truncate w-full md:w-auto flex-1 text-center md:text-left">---</span>
                
                <div class="flex items-center gap-2 w-full md:w-auto justify-center">
                    <button onclick="copyEmail()" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-2.5 rounded-full transition-all shadow-md font-semibold text-sm flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-copy mr-2"></i> কপি
                    </button>
                    <button onclick="generateNewMailbox()" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-5 py-2.5 rounded-full transition-all shadow-md font-bold text-sm flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-plus mr-1.5"></i> Get Mail
                    </button>
                </div>
            </div>
            
            <div class="flex flex-col md:flex-row items-center justify-center gap-6 text-sm mb-2">
                <div class="flex items-center text-slate-700 font-semibold glass-btn px-5 py-2 rounded-full">
                    <i class="fas fa-stopwatch mr-2 text-indigo-500"></i> মেয়াদ: <span id="countdown" class="ml-1 tracking-wider font-bold">00:00:00</span>
                </div>
                <button onclick="triggerDelete(currentEmail)" class="text-slate-500 hover:text-rose-500 font-bold flex items-center transition-colors px-4 py-2 rounded-full hover:bg-white/50">
                    <i class="fas fa-trash-alt mr-2"></i> মেইলবক্স মুছুন
                </button>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="glass-card rounded-[2rem] overflow-hidden flex flex-col h-[500px]">
            <div class="border-b border-white/40 p-5 flex justify-between items-center sticky top-0 z-10">
                <h2 class="text-lg font-extrabold text-slate-800 flex items-center">
                    <span class="w-10 h-10 rounded-full glass-btn text-indigo-600 flex items-center justify-center mr-3 shadow-sm">
                        <i class="fas fa-inbox text-lg"></i>
                    </span>
                    ইনবক্স
                </h2>
                <div id="pollingIndicator" class="text-xs font-bold text-indigo-600 glass-btn px-4 py-2 rounded-full flex items-center hidden shadow-sm">
                    <i class="fas fa-circle-notch fa-spin mr-2"></i> সিঙ্ক হচ্ছে...
                </div>
            </div>

            <div class="relative flex-grow overflow-hidden">
                <!-- Email Detail View -->
                <div id="emailDetailView" class="hidden absolute inset-0 bg-white/60 backdrop-blur-2xl z-20 flex flex-col transition-all duration-300">
                    <div class="p-4 border-b border-white/50 flex items-center justify-between sticky top-0">
                        <button onclick="closeEmailDetail()" class="w-10 h-10 rounded-full glass-btn text-slate-700 hover:text-indigo-600 flex items-center justify-center transition-colors">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">মেইল ভিউ</span>
                        <div class="w-10"></div>
                    </div>
                    
                    <div class="p-6 overflow-y-auto hide-scroll flex-grow">
                        <div id="otpContainer" class="hidden mb-8 flex justify-center">
                            <button onclick="copyOTP()" class="group relative bg-gradient-to-r from-amber-400 to-orange-500 p-[2px] rounded-full shadow-lg hover:shadow-xl transition-all hover:-translate-y-1">
                                <div class="bg-white/90 backdrop-blur-sm rounded-full px-8 py-3 flex items-center gap-3">
                                    <i class="fas fa-key text-orange-500"></i>
                                    <span class="text-xs font-bold text-slate-500 uppercase">OTP Code</span>
                                    <span id="otpValue" class="text-2xl font-extrabold text-slate-800 tracking-widest ml-2"></span>
                                    <i class="fas fa-copy text-slate-300 group-hover:text-orange-500 ml-2 transition-colors"></i>
                                </div>
                            </button>
                        </div>

                        <h3 id="detailSubject" class="text-2xl font-extrabold mb-6 text-slate-800 leading-tight"></h3>
                        
                        <div class="flex items-center gap-4 mb-8 glass-btn p-4 rounded-2xl">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold text-lg shadow-md" id="avatarInitial">S</div>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-slate-800 truncate text-base" id="detailSender"></div>
                                <div class="text-xs text-slate-500 truncate mt-0.5 font-medium">To: <span id="detailRecipient"></span></div>
                            </div>
                            <div class="text-xs font-bold text-slate-500 glass-btn px-3 py-1.5 rounded-full" id="detailTime"></div>
                        </div>

                        <div id="detailBody" class="text-slate-700 whitespace-pre-line text-base leading-relaxed p-2 font-medium"></div>
                    </div>
                </div>

                <!-- Email List -->
                <div id="inboxList" class="absolute inset-0 overflow-y-auto hide-scroll">
                    <div id="emptyState" class="flex flex-col items-center justify-center h-full text-slate-400 px-6 text-center">
                        <div class="w-24 h-24 glass-btn rounded-full shadow-sm flex items-center justify-center mb-6">
                            <i class="fas fa-envelope-open-text text-4xl text-slate-300"></i>
                        </div>
                        <p class="font-extrabold text-xl text-slate-600 mb-2">ইনবক্স খালি</p>
                        <p class="text-sm font-medium text-slate-500">এখানে আপনার নতুন ইমেইলগুলো দেখা যাবে।</p>
                    </div>
                    <ul id="emailItems" class="divide-y divide-white/40 hidden"></ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = {
            baseUrl: "https://taskesy-temp-mail.mdwldhsn336.workers.dev",
            async create() {
                try {
                    const res = await fetch(`${this.baseUrl}/api/create`, { method: "POST", headers: { "Accept": "application/json" } });
                    return await res.json();
                } catch (err) { return { success: false, error: err.message }; }
            },
            async getInbox(address) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/inbox?address=${encodeURIComponent(address)}`);
                    return await res.json();
                } catch (err) { return { success: false, error: err.message }; }
            },
            async deleteMailbox(address) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/delete?address=${encodeURIComponent(address)}`, { method: "DELETE", headers: { "Accept": "application/json" } });
                    return await res.json();
                } catch (err) { return { success: false, error: err.message }; }
            }
        };

        let savedAccounts = JSON.parse(localStorage.getItem('taskesy_accounts')) || [];
        let currentEmail = "";
        let expiresAt = null;
        let countdownInterval = null;
        let pollingInterval = null;
        let seenEmailIds = new Set();
        let loadedEmails = []; 
        let currentOTP = "";
        
        // Variables for Custom Modal
        let emailToDelete = null;
        let eventToDelete = null;

        // Theme Management
        const themeGradients = {
            'default': ['from-indigo-50', 'via-purple-50', 'to-pink-50'],
            'ocean': ['from-cyan-50', 'via-blue-50', 'to-indigo-50'],
            'forest': ['from-emerald-50', 'via-teal-50', 'to-green-50'],
            'sunset': ['from-orange-50', 'via-rose-50', 'to-pink-50']
        };

        function setTheme(themeName) {
            const body = document.getElementById('appBody');
            Object.values(themeGradients).forEach(classes => body.classList.remove(...classes));
            body.classList.add(...themeGradients[themeName]);
            localStorage.setItem('taskesy_theme', themeName);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('taskesy_theme') || 'default';
            setTheme(savedTheme);
            initApp();
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-500' : 'bg-slate-800';
            const icon = type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle';
            
            toast.className = `transform transition-all duration-300 translate-y-[-100%] opacity-0 ${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl pointer-events-auto flex items-center justify-center gap-3 text-sm font-bold max-w-max mx-auto`;
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-[-100%]', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); }, 10);
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-100%]', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('translate-x-full')) {
                overlay.classList.remove('hidden');
                setTimeout(() => { overlay.classList.add('opacity-100'); sidebar.classList.remove('translate-x-full'); sidebar.classList.add('translate-x-0'); }, 10);
                renderSidebarList();
            } else {
                sidebar.classList.remove('translate-x-0'); sidebar.classList.add('translate-x-full');
                overlay.classList.remove('opacity-100'); setTimeout(() => { overlay.classList.add('hidden'); }, 300);
            }
        }

        async function initApp() {
            cleanupExpiredAccounts();
            if (savedAccounts.length > 0) switchAccount(savedAccounts[0].address);
            else generateNewMailbox();
        }

        async function generateNewMailbox() {
            showLoading(true);
            const response = await API.create();
            
            if (response.success) {
                const newAccount = { address: response.address, expires_at: response.expires_at };
                savedAccounts.unshift(newAccount);
                localStorage.setItem('taskesy_accounts', JSON.stringify(savedAccounts));
                
                const sidebar = document.getElementById('sidebar');
                if(!sidebar.classList.contains('translate-x-full')) toggleSidebar();
                
                showToast("নতুন মেইলবক্স তৈরি হয়েছে!");
                switchAccount(response.address);
            } else {
                showToast("ইমেইল তৈরি করতে সমস্যা হয়েছে!", 'error');
                document.getElementById('emailAddress').innerText = "Error";
                showLoading(false);
            }
        }

        function switchAccount(address) {
            const account = savedAccounts.find(acc => acc.address === address);
            if (!account) return;
            stopPolling();
            closeEmailDetail();
            
            currentEmail = account.address;
            expiresAt = new Date(account.expires_at).getTime();
            
            document.getElementById('emailAddress').innerText = currentEmail;
            document.getElementById('emailItems').innerHTML = '';
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('emailItems').classList.add('hidden');
            
            seenEmailIds.clear(); loadedEmails = [];
            startCountdown(); startPolling(); showLoading(false);
        }

        function renderSidebarList() {
            const listContainer = document.getElementById('savedEmailsList');
            listContainer.innerHTML = '';
            cleanupExpiredAccounts(); 

            savedAccounts.forEach(acc => {
                const isActive = acc.address === currentEmail;
                const li = document.createElement('li');
                li.className = `p-4 rounded-2xl cursor-pointer transition-all duration-300 flex items-center justify-between group ${isActive ? 'bg-white shadow-md border border-white' : 'glass-btn hover:bg-white/80 border border-transparent'}`;
                
                li.innerHTML = `
                    <div class="truncate flex-1 min-w-0" onclick="switchAccount('${acc.address}'); toggleSidebar();">
                        <p class="font-extrabold text-sm ${isActive ? 'text-indigo-600' : 'text-slate-700'} truncate">${acc.address}</p>
                        <p class="text-xs text-slate-500 mt-1 font-medium"><i class="fas fa-clock"></i> ${formatTimeOnly(acc.expires_at)}</p>
                    </div>
                    <button onclick="triggerDelete('${acc.address}', event, this)" class="ml-3 w-8 h-8 rounded-full bg-rose-50 text-rose-400 hover:bg-rose-500 hover:text-white flex items-center justify-center transition-all flex-shrink-0" title="Delete">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                `;
                listContainer.appendChild(li);
            });
        }

        function cleanupExpiredAccounts() {
            const now = new Date().getTime();
            const originalLength = savedAccounts.length;
            savedAccounts = savedAccounts.filter(acc => new Date(acc.expires_at).getTime() > now);
            if (originalLength !== savedAccounts.length) localStorage.setItem('taskesy_accounts', JSON.stringify(savedAccounts));
        }

        function showLoading(isLoading) {
            const loader = document.getElementById('loadingEmail');
            if(isLoading) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        async function copyEmail() {
            if (!currentEmail || currentEmail === 'Error') return;
            try {
                await navigator.clipboard.writeText(currentEmail);
                showToast("ইমেইল ঠিকানা কপি করা হয়েছে!");
            } catch (err) { showToast("কপি করতে সমস্যা হয়েছে", 'error'); }
        }

        async function copyOTP() {
            if (!currentOTP) return;
            try {
                await navigator.clipboard.writeText(currentOTP);
                showToast("OTP কোড কপি করা হয়েছে!");
            } catch (err) { showToast("কপি করতে সমস্যা হয়েছে", 'error'); }
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            const countdownEl = document.getElementById('countdown');
            countdownEl.parentElement.classList.remove('text-rose-500', 'bg-rose-50');
            countdownEl.parentElement.classList.add('text-slate-700', 'glass-btn');
            
            countdownInterval = setInterval(() => {
                const distance = expiresAt - new Date().getTime();
                if (distance < 0) {
                    clearInterval(countdownInterval);
                    countdownEl.innerText = "মেয়াদ শেষ";
                    countdownEl.parentElement.classList.remove('text-slate-700', 'glass-btn');
                    countdownEl.parentElement.classList.add('text-rose-600', 'bg-rose-100');
                    stopPolling();
                    savedAccounts = savedAccounts.filter(acc => acc.address !== currentEmail);
                    localStorage.setItem('taskesy_accounts', JSON.stringify(savedAccounts));
                    return;
                }
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.innerText = String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
            }, 1000);
        }

        function startPolling() {
            fetchInbox();
            pollingInterval = setInterval(fetchInbox, 8000);
        }

        function stopPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('pollingIndicator').classList.add('hidden');
        }

        async function fetchInbox() {
            if (!currentEmail || currentEmail === 'Error') return;
            document.getElementById('pollingIndicator').classList.remove('hidden');
            const response = await API.getInbox(currentEmail);
            
            if (response.success && response.emails) {
                if(response.emails.length > loadedEmails.length) renderInbox(response.emails);
                loadedEmails = response.emails; 
            } else if (response.error === "Mailbox expired") {
                savedAccounts = savedAccounts.filter(acc => acc.address !== currentEmail);
                localStorage.setItem('taskesy_accounts', JSON.stringify(savedAccounts));
                stopPolling(); showToast("এই মেইলটির মেয়াদ শেষ হয়ে গেছে", "error");
            }
            setTimeout(() => document.getElementById('pollingIndicator').classList.add('hidden'), 1000);
        }

        function renderInbox(emails) {
            const emptyState = document.getElementById('emptyState');
            const emailItems = document.getElementById('emailItems');
            
            if (!emails || emails.length === 0) {
                emptyState.classList.remove('hidden'); emailItems.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            if(document.getElementById('emailDetailView').classList.contains('hidden')) emailItems.classList.remove('hidden');
            
            emailItems.innerHTML = '';
            emails.forEach((email, index) => {
                const isNew = !seenEmailIds.has(email.id);
                if(isNew && loadedEmails.length > 0) showToast("নতুন ইমেইল এসেছে!");
                seenEmailIds.add(email.id);

                const dateStr = email.received_at || email['received at'];
                const subject = email.subject || '(No Subject)';
                const sender = email.sender || 'Unknown Sender';
                const initial = sender.charAt(0).toUpperCase();
                
                const li = document.createElement('li');
                // Animation classes added here for new emails
                li.className = `p-4 cursor-pointer transition-all duration-300 flex items-center gap-4 ${isNew ? 'bg-white/60 border-l-4 border-indigo-500 animate-mail-in opacity-0' : 'hover:bg-white/40 border-transparent'}`;
                li.onclick = () => viewEmail(email.id);
                li.innerHTML = `
                    <div class="w-12 h-12 rounded-full glass-btn shadow-sm flex items-center justify-center text-indigo-600 font-extrabold flex-shrink-0">${initial}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[15px] font-bold text-slate-800 truncate">${escapeHTML(sender)}</span>
                            <span class="text-xs font-bold text-slate-500 whitespace-nowrap ml-3">${formatDate(dateStr)}</span>
                        </div>
                        <p class="text-sm font-medium text-slate-600 truncate">${escapeHTML(subject)}</p>
                    </div>
                `;
                
                // Staggered animation
                if (isNew) {
                    li.style.animationDelay = `${index * 0.1}s`;
                }
                emailItems.appendChild(li);
            });
        }

        function viewEmail(id) {
            const em = loadedEmails.find(e => String(e.id) === String(id));
            if (em) {
                const dateStr = em.received_at || em['received at'];
                const sender = em.sender || 'Unknown';
                document.getElementById('detailSubject').innerText = em.subject || '(No Subject)';
                document.getElementById('detailSender').innerText = sender;
                document.getElementById('avatarInitial').innerText = sender.charAt(0).toUpperCase();
                document.getElementById('detailRecipient').innerText = em.recipient || currentEmail;
                document.getElementById('detailTime').innerText = formatDate(dateStr);
                
                const bodyText = em.body || '';
                document.getElementById('detailBody').innerHTML = bodyText ? escapeHTML(bodyText) : '<i>(Empty Message)</i>';
                
                const otpMatch = bodyText.match(/\b\d{6}\b|\b\d{8}\b/);
                const otpContainer = document.getElementById('otpContainer');
                if(otpMatch) {
                    currentOTP = otpMatch[0]; document.getElementById('otpValue').innerText = currentOTP; otpContainer.classList.remove('hidden');
                } else { currentOTP = ""; otpContainer.classList.add('hidden'); }
                
                document.getElementById('inboxList').classList.add('hidden');
                document.getElementById('emailDetailView').classList.remove('hidden');
            }
        }

        function closeEmailDetail() {
            document.getElementById('emailDetailView').classList.add('hidden');
            document.getElementById('inboxList').classList.remove('hidden');
        }

        // Custom Colorful Modal Logic
        function triggerDelete(address, event = null, element = null) {
            if(event) event.stopPropagation(); 
            emailToDelete = address;
            eventToDelete = { elem: element ? element.closest('li') : null };
            
            const modal = document.getElementById('confirmModal');
            const overlay = document.getElementById('confirmOverlay');
            const content = document.getElementById('confirmContent');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; // trigger reflow
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100');
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const overlay = document.getElementById('confirmOverlay');
            const content = document.getElementById('confirmContent');
            
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => { modal.classList.add('hidden'); emailToDelete = null; eventToDelete = null; }, 300);
        }

        async function confirmDeleteAction() {
            if(!emailToDelete) return;
            const address = emailToDelete;
            const targetElement = eventToDelete?.elem;
            closeConfirmModal();
            
            // Delete Animation
            if(targetElement) {
                targetElement.style.transform = 'scale(0.9)';
                targetElement.style.opacity = '0';
            } else if (address === currentEmail) {
                document.getElementById('mainCard').style.transform = 'scale(0.95)';
                document.getElementById('mainCard').style.opacity = '0.5';
            }
            
            try {
                await API.deleteMailbox(address);
                savedAccounts = savedAccounts.filter(acc => acc.address !== address);
                localStorage.setItem('taskesy_accounts', JSON.stringify(savedAccounts));
                showToast("মেইলবক্স মুছে ফেলা হয়েছে");
                
                setTimeout(() => {
                    if (address === currentEmail) {
                        document.getElementById('mainCard').style.transform = 'scale(1)';
                        document.getElementById('mainCard').style.opacity = '1';
                        if (savedAccounts.length > 0) switchAccount(savedAccounts[0].address);
                        else generateNewMailbox();
                    } else {
                        if(targetElement) targetElement.remove();
                        renderSidebarList();
                    }
                }, 300);
                
            } catch (err) {
                showToast("নেটওয়ার্ক সমস্যা", 'error');
                if(targetElement) {
                    targetElement.style.transform = 'scale(1)';
                    targetElement.style.opacity = '1';
                }
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const d = new Date(dateString.replace(' ', 'T'));
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch(e) { return dateString; }
        }
        
        function formatTimeOnly(dateString) {
            if (!dateString) return '';
            try {
                const d = new Date(dateString.replace(' ', 'T'));
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
            } catch(e) { return dateString; }
        }
    </script>
</body>
