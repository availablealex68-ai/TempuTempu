<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskesy Temp Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl font-bold"><i class="fas fa-envelope-open-text mr-2"></i> Taskesy Temp Mail</h1>
            <p class="text-indigo-200 mt-1 text-sm md:text-base">আপনার অস্থায়ী এবং সুরক্ষিত ইমেইল ঠিকানা</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        
        <!-- Email Generation Box -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8 text-center relative">
            <div id="loadingEmail" class="absolute inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center rounded-xl z-10 hidden">
                <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-500 mb-2"></i>
                <p class="text-slate-500 font-medium">প্রসেসিং হচ্ছে...</p>
            </div>

            <p class="text-sm text-slate-500 mb-2 font-semibold uppercase tracking-wider">আপনার অস্থায়ী ইমেইল ঠিকানা</p>
            <div class="flex flex-col md:flex-row items-center justify-center gap-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <span id="emailAddress" class="text-xl md:text-2xl font-bold text-indigo-700 break-all">---</span>
                <button onclick="copyEmail()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-md transition-colors font-medium text-sm border border-indigo-200 flex items-center">
                    <i class="fas fa-copy mr-2"></i> কপি করুন
                </button>
            </div>
            
            <div class="mt-4 flex flex-col md:flex-row items-center justify-between gap-4 text-sm">
                <div class="flex items-center text-amber-600 font-medium bg-amber-50 px-3 py-1.5 rounded-md">
                    <i class="fas fa-clock mr-2"></i> মেয়াদ শেষ হবে: <span id="countdown" class="ml-1 font-bold">00:00:00</span>
                </div>
                <button onclick="deleteMailbox()" class="text-red-500 hover:text-red-700 font-medium flex items-center transition-colors">
                    <i class="fas fa-trash-alt mr-1"></i> ডিলিট মেইলবক্স
                </button>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 p-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-inbox text-indigo-500 mr-2"></i> ইনবক্স</h2>
                <div id="pollingIndicator" class="text-xs text-slate-400 flex items-center">
                    <i class="fas fa-sync-alt fa-spin mr-1"></i> রিফ্রেশ হচ্ছে...
                </div>
            </div>

            <!-- Email Detail View -->
            <div id="emailDetailView" class="hidden p-6 border-b border-slate-200 bg-slate-50">
                <button onclick="closeEmailDetail()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 mb-4 flex items-center">
                    <i class="fas fa-arrow-left mr-1"></i> ইনবক্সে ফিরে যান
                </button>
                <div class="bg-white border border-slate-200 rounded-lg p-5">
                    <h3 id="detailSubject" class="text-xl font-bold mb-4 text-slate-800"></h3>
                    <div class="flex flex-col gap-2 mb-6 text-sm border-b border-slate-100 pb-4">
                        <div><span class="text-slate-500 w-16 inline-block">From:</span> <span id="detailSender" class="font-medium"></span></div>
                        <div><span class="text-slate-500 w-16 inline-block">To:</span> <span id="detailRecipient" class="font-medium text-slate-600"></span></div>
                        <div><span class="text-slate-500 w-16 inline-block">Date:</span> <span id="detailTime" class="text-slate-600"></span></div>
                    </div>
                    <div id="detailBody" class="text-slate-700 whitespace-pre-wrap font-mono text-sm bg-slate-50 p-4 rounded"></div>
                </div>
            </div>

            <!-- Email List -->
            <div id="inboxList" class="min-h-[300px]">
                <!-- Empty State -->
                <div id="emptyState" class="flex flex-col items-center justify-center h-[300px] text-slate-400">
                    <i class="fas fa-envelope-open text-6xl mb-4 text-slate-200"></i>
                    <p class="font-medium text-lg">ইনবক্স খালি</p>
                    <p class="text-sm mt-1">নতুন ইমেইলের জন্য অপেক্ষা করা হচ্ছে...</p>
                </div>
                <!-- List container -->
                <ul id="emailItems" class="divide-y divide-slate-100 hidden"></ul>
            </div>
        </div>
    </main>

    <footer class="text-center text-slate-500 text-sm py-6">
        &copy; 2026 Taskesy Mail. All rights reserved.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const API = {
            baseUrl: "https://taskesy-temp-mail.mdwldhsn336.workers.dev",
            
            async create() {
                try {
                    const res = await fetch(`${this.baseUrl}/api/create`, { 
                        method: "POST",
                        headers: { "Accept": "application/json" }
                    });
                    return await res.json();
                } catch (err) {
                    return { success: false, error: err.message };
                }
            },
            
            async getInbox(address) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/inbox?address=${encodeURIComponent(address)}`);
                    return await res.json();
                } catch (err) {
                    return { success: false, error: err.message };
                }
            },
            
            async getEmail(id) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/email?id=${encodeURIComponent(id)}`);
                    return await res.json();
                } catch (err) {
                    return { success: false, error: err.message };
                }
            },
            
            async deleteMailbox(address) {
                try {
                    const res = await fetch(`${this.baseUrl}/api/mailbox?address=${encodeURIComponent(address)}`, { 
                        method: "DELETE",
                        headers: { "Accept": "application/json" }
                    });
                    return await res.json();
                } catch (err) {
                    return { success: false, error: err.message };
                }
            }
        };

        let currentEmail = "";
        let expiresAt = null;
        let countdownInterval = null;
        let pollingInterval = null;
        let seenEmailIds = new Set();

        document.addEventListener("DOMContentLoaded", initApp);

        async function initApp() {
            showLoading(true);
            const response = await API.create();
            
            if (response.success) {
                currentEmail = response.address;
                expiresAt = new Date(response.expires_at).getTime();
                
                document.getElementById('emailAddress').innerText = currentEmail;
                
                startCountdown();
                startPolling();
                showLoading(false);
            } else {
                alert("ইমেইল তৈরি করতে সমস্যা হয়েছে: " + (response.error || "Unknown Error"));
                showLoading(false);
            }
        }

        function showLoading(isLoading) {
            const loader = document.getElementById('loadingEmail');
            if(isLoading) {
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        async function copyEmail() {
            if (!currentEmail) return;
            try {
                await navigator.clipboard.writeText(currentEmail);
                alert("ইমেইল কপি করা হয়েছে!");
            } catch (err) {
                console.error("Copy failed", err);
            }
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            const countdownEl = document.getElementById('countdown');
            countdownEl.classList.remove('text-red-500');
            
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = expiresAt - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    countdownEl.innerText = "মেয়াদ শেষ";
                    countdownEl.classList.add('text-red-500');
                    stopPolling();
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownEl.innerText = 
                    String(hours).padStart(2, '0') + ":" + 
                    String(minutes).padStart(2, '0') + ":" + 
                    String(seconds).padStart(2, '0');
            }, 1000);
        }

        function startPolling() {
            fetchInbox();
            pollingInterval = setInterval(fetchInbox, 8000);
        }

        function stopPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('pollingIndicator').classList.add('hidden');
        }

        async function fetchInbox() {
            if (!currentEmail) return;
            const response = await API.getInbox(currentEmail);
            if (response.success && response.emails) {
                renderInbox(response.emails);
            }
        }

        function renderInbox(emails) {
            const emptyState = document.getElementById('emptyState');
            const emailItems = document.getElementById('emailItems');
            
            if (!emails || emails.length === 0) {
                emptyState.classList.remove('hidden');
                emailItems.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            emailItems.classList.remove('hidden');
            
            let listHTML = '';
            emails.forEach(email => {
                const isNew = !seenEmailIds.has(email.id);
                if(isNew) seenEmailIds.add(email.id);

                const dateStr = email.received_at || email['received at'];
                const subject = email.subject || '(No Subject)';
                const sender = email.sender || 'Unknown Sender';
                
                listHTML += `
                    <li class="p-4 hover:bg-indigo-50 cursor-pointer transition-colors flex items-center justify-between ${isNew ? 'bg-blue-50/50 border-l-4 border-blue-500' : ''}" onclick="viewEmail('${email.id}')">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm font-semibold text-slate-800 truncate">${escapeHTML(sender)}</span>
                                <span class="text-xs text-slate-500 whitespace-nowrap ml-4">${formatDate(dateStr)}</span>
                            </div>
                            <p class="text-sm font-medium text-slate-700 truncate">${escapeHTML(subject)}</p>
                        </div>
                    </li>
                `;
            });
            emailItems.innerHTML = listHTML;
        }

        async function viewEmail(id) {
            try {
                document.getElementById('pollingIndicator').innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> লোড হচ্ছে...`;
                document.getElementById('pollingIndicator').classList.remove('hidden');
                
                const response = await API.getEmail(id);
                
                if (response.success && response.email) {
                    const em = response.email;
                    const dateStr = em.received_at || em['received at'];
                    
                    document.getElementById('detailSubject').innerText = em.subject || '(No Subject)';
                    document.getElementById('detailSender').innerText = em.sender || 'Unknown';
                    document.getElementById('detailRecipient').innerText = em.recipient || currentEmail;
                    document.getElementById('detailTime').innerText = formatDate(dateStr);
                    document.getElementById('detailBody').innerText = em.body || '';
                    
                    document.getElementById('inboxList').classList.add('hidden');
                    document.getElementById('emailDetailView').classList.remove('hidden');
                } else {
                    alert("ইমেইল লোড করতে সমস্যা হয়েছে: " + (response.error || "API Error"));
                }
            } catch (err) {
                alert("ইমেইল লোড করতে সমস্যা হয়েছে: " + err.message);
            } finally {
                document.getElementById('pollingIndicator').innerHTML = `<i class="fas fa-sync-alt fa-spin mr-1"></i> রিফ্রেশ হচ্ছে...`;
            }
        }

        function closeEmailDetail() {
            document.getElementById('emailDetailView').classList.add('hidden');
            document.getElementById('inboxList').classList.remove('hidden');
        }

        async function deleteMailbox() {
            if (!confirm("আপনি কি নিশ্চিত যে আপনি মেইলবক্সটি ডিলিট করতে চান?")) return;
            
            stopPolling();
            if (countdownInterval) clearInterval(countdownInterval);
            showLoading(true);
            
            try {
                const response = await API.deleteMailbox(currentEmail);
                
                if (response.success) {
                    currentEmail = "";
                    document.getElementById('emailAddress').innerText = "---";
                    document.getElementById('countdown').innerText = "00:00:00";
                    document.getElementById('emailItems').innerHTML = '';
                    document.getElementById('emptyState').classList.remove('hidden');
                    document.getElementById('emailItems').classList.add('hidden');
                    closeEmailDetail();
                    
                    initApp();
                } else {
                    alert("ডিলিট করতে সমস্যা হয়েছে: " + (response.error || "Backend/API Error"));
                    startPolling();
                    showLoading(false);
                }
            } catch (err) {
                alert("ডিলিট করতে সমস্যা হয়েছে (Network/CORS): " + err.message);
                startPolling();
                showLoading(false);
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const d = new Date(dateString.replace(' ', 'T'));
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch(e) {
                return dateString;
            }
        }
    </script>
</body>
</html>
